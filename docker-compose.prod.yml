# ==============================================================================
# CloudResumeAI Production Docker Compose Stack
# - Database & Backend API are NOT exposed on host ports (internal network only).
# - Frontend Nginx acts as the single reverse-proxy entrypoint on port 80/443.
# - Production environment variables (FLASK_ENV=production, FLASK_DEBUG=0).
# ==============================================================================

services:
  # 1. PostgreSQL Database (Internal only, zero host ports published)
  db:
    image: postgres:16-alpine
    container_name: cloudresumeai-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cloudresumeai_prod}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-cloudresumeai_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    networks:
      - cloudresume-prod-network

  # 2. Flask Gunicorn API (Internal only, reached via Nginx /api/ upstream)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudresumeai-backend-prod
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: 0
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cloudresumeai_prod}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cloudresumeai_prod}
      POSTGRES_SSLMODE: prefer
      DEV_AUTH_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cloudresume.ai}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - cloudresume-prod-network

  # 3. Frontend React SPA served via Nginx (Single public gateway)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudresumeai-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - cloudresume-prod-network

volumes:
  postgres_data_prod:
    driver: local

networks:
  cloudresume-prod-network:
    driver: bridge
