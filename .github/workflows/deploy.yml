name: Azure Cloud Deployment

# IMPORTANT: This workflow is strictly manually triggered (workflow_dispatch)
# and remains disabled from automatic execution until Azure credentials and
# subscription secrets are configured in the GitHub repository.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Azure deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      deploy_infra:
        description: 'Deploy or update Azure infrastructure via Bicep'
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Microsoft Azure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure CLI Login (Federated OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Infrastructure (Bicep)
        if: ${{ github.event.inputs.deploy_infra == 'true' }}
        id: bicep-deploy
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP || format('rg-cloudresumeai-{0}', github.event.inputs.environment) }}
          template: ./infra/bicep/main.bicep
          parameters: >-
            ./infra/bicep/parameters.${{ github.event.inputs.environment }}.json
            postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}"
            flaskSecretKey="${{ secrets.FLASK_SECRET_KEY }}"
            geminiApiKey="${{ secrets.GEMINI_API_KEY }}"
          failOnStderr: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_ACR_LOGIN_SERVER }}/cloudresumeai-backend:latest
            ${{ vars.AZURE_ACR_LOGIN_SERVER }}/cloudresumeai-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_ACR_LOGIN_SERVER }}/cloudresumeai-frontend:latest
            ${{ vars.AZURE_ACR_LOGIN_SERVER }}/cloudresumeai-frontend:${{ github.sha }}

      - name: Deploy Backend Container App Revision
        run: |
          az containerapp update \
            --name "ca-cloudresumeai-backend-${{ github.event.inputs.environment }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP || format('rg-cloudresumeai-{0}', github.event.inputs.environment) }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/cloudresumeai-backend:${{ github.sha }}"

      - name: Deploy Frontend Container App Revision
        run: |
          az containerapp update \
            --name "ca-cloudresumeai-frontend-${{ github.event.inputs.environment }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP || format('rg-cloudresumeai-{0}', github.event.inputs.environment) }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/cloudresumeai-frontend:${{ github.sha }}"

      - name: Post-Deployment Health Check
        run: |
          BACKEND_URL="${{ steps.bicep-deploy.outputs.backendApiUrl || vars.BACKEND_API_URL }}"
          echo "Verifying backend health on $BACKEND_URL/api/health..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check succeeded: HTTP 200 OK"
              exit 0
            fi
            echo "Waiting for backend service to stabilize (attempt $i/10, status: $STATUS)..."
            sleep 10
          done
          echo "Health check timed out waiting for backend to return HTTP 200"
          exit 1

