<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#cloudGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Stylized Resume Document with Folded Corner -->
  <g filter="url(#shadow)">
    <!-- Document Body -->
    <path d="M19 13 H35 L43 21 V51 H19 Z" fill="url(#sheetGrad)" />
    <!-- Folded Corner -->
    <path d="M35 13 V21 H43 Z" fill="#D1D5DB" />
    <!-- Resume Content Lines -->
    <rect x="23" y="23" width="9" height="2.5" rx="1.25" fill="#D97706" />
    <rect x="23" y="28.5" width="15" height="1.8" rx="0.9" fill="#9CA3AF" />
    <rect x="23" y="32.5" width="13" height="1.8" rx="0.9" fill="#9CA3AF" />
    <rect x="23" y="36.5" width="15" height="1.8" rx="0.9" fill="#9CA3AF" />
    <!-- Skills pills -->
    <rect x="23" y="41.5" width="5.5" height="1.8" rx="0.9" fill="#F59E0B" />
    <rect x="30" y="41.5" width="6.5" height="1.8" rx="0.9" fill="#F59E0B" />
  </g>

  <!-- Stylized Floating Cloud Badge -->
  <path d="M36 47 C36 44.5 38 42.5 40.5 42.5 C41 42.5 41.5 42.6 42 42.8 C42.8 41 44.6 39.8 46.7 39.8 C49.5 39.8 51.8 42 51.8 44.8 C51.8 45.1 51.8 45.4 51.7 45.7 C52.9 46.3 53.7 47.5 53.7 49 C53.7 51 52.1 52.6 50.1 52.6 H40 C37.8 52.6 36 50.8 36 47 Z"
        fill="#FFFFFF"
        filter="url(#shadow)" />
</svg>
